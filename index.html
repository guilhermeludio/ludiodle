:root{
  --h:172;
  --bg:hsl(var(--h) 38% 7%);--panel:hsl(var(--h) 28% 12%);--panel2:hsl(var(--h) 26% 17%);--line:hsl(var(--h) 22% 25%);
  --text:#f2f5f4;--muted:hsl(var(--h) 14% 66%);--accent:hsl(var(--h) 92% 60%);--on-accent:#06110f;
  /* escala de proximidade fixa em todos os modos: verde = perto, laranja = meio, vermelho = longe */
  --c1:#00f07a;--c2:#4cf03a;--c3:#c4f01e;--c4:#ffbf1a;--c5:#ff6a0d;--c6:#ff2d45;
  --radius:8px;
  --display:"Anton","Impact","Arial Narrow Bold","Haettenschweiler",sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-mode=anime]{--h:330}:root[data-mode=naruto]{--h:26}:root[data-mode=fa]{--h:128}
:root[data-mode=onepiece]{--h:214}:root[data-mode=pokemon]{--h:52}:root[data-mode=minecraft]{--h:104}:root[data-mode=pokemon1]{--h:6}:root[data-mode=nfl]{--h:236}:root[data-mode=lol]{--h:275}
@media (prefers-color-scheme:light){:root{
  --bg:hsl(var(--h) 30% 95%);--panel:#fff;--panel2:hsl(var(--h) 28% 91%);--line:hsl(var(--h) 18% 80%);
  --text:#14181a;--muted:hsl(var(--h) 10% 38%);--accent:hsl(var(--h) 86% 38%);--on-accent:#fff;
  --c1:#00a84f;--c2:#2fa81c;--c3:#8aa800;--c4:#d99200;--c5:#e85a00;--c6:#e0182f;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body{min-height:100vh;position:relative}
/* meio-tom: pontos na cor do modo, somem para baixo */
body::before{content:"";position:absolute;inset:0 0 auto 0;height:340px;pointer-events:none;
  background:radial-gradient(circle,hsl(var(--h) 90% 55%/.22) 1.2px,transparent 1.6px) 0 0/11px 11px;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{position:relative;max-width:620px;margin:0 auto;padding:14px 16px calc(44px + env(safe-area-inset-bottom))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 12px;padding:10px 0 2px}
h1{display:flex;align-items:center;gap:10px;margin:0;font:400 clamp(1.7rem,9vw,2.3rem)/1 var(--display);letter-spacing:.02em;text-transform:uppercase}
.mark{width:8px;align-self:stretch;border-radius:2px;background:linear-gradient(var(--c1),var(--c2) 22%,var(--c3) 42%,var(--c4) 60%,var(--c5) 80%,var(--c6))}
nav{display:flex;gap:18px}
nav button{border:0;background:none;padding:6px 0;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
nav button[aria-selected=true]{color:var(--text);border-bottom-color:var(--accent)}
.modes{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 8px}
.modes button{border:1.5px solid var(--line);background:transparent;border-radius:var(--radius);padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.modes button:hover{color:var(--text);border-color:var(--accent)}
.modes button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sub{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;padding:8px 2px 10px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius);padding:10px}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;outline:none;font-size:1.2rem;font-weight:600}
input[type=text]::placeholder{color:var(--muted);font-weight:400}
input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px hsl(var(--h) 90% 55%/.25)}
.btn{border:1.5px solid var(--line);background:var(--panel2);border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled,input:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row .btn{flex:1;white-space:nowrap;background:transparent}
#msg{min-height:1.5em;margin:10px 2px 6px;color:var(--muted);font-size:.95rem}
#msg.err{color:#ff7d7d} #msg.ok{color:var(--c2)}
@media (prefers-color-scheme:light){#msg.err{color:#b3202a}}
#msg .sug{font:inherit;font-weight:700;color:var(--on-accent);background:var(--accent);border:0;border-radius:5px;padding:1px 9px;margin:0 2px;cursor:pointer}
.stats{display:flex;gap:6px 22px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin:0 2px 14px}
.stats span{display:flex;align-items:baseline;gap:6px}
.stats b.hid{letter-spacing:.1em;opacity:.6}
.stats b{font:400 1.35rem/1 var(--display);color:var(--text);letter-spacing:.02em}
.g{box-shadow:0 0 0 1px color-mix(in srgb,var(--heat,transparent) 45%,transparent) inset;position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px 9px 16px;border-radius:6px;margin:5px 0;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.g::before{content:"";position:absolute;inset:0 auto 0 0;width:7px;background:var(--heat)}
.g .bar{position:absolute;inset:0 auto 0 0;opacity:.62;background:linear-gradient(90deg,var(--heat),transparent 125%);transform-origin:left}

.g .w{font-weight:700;font-size:1.05rem;word-break:break-word}
.g .r{font:400 1.6rem/1 var(--display);text-shadow:0 0 12px color-mix(in srgb,var(--heat) 55%,transparent);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--heat)}

.k1{--heat:var(--c1)}.k2{--heat:var(--c2)}.k3{--heat:var(--c3)}.k4{--heat:var(--c4)}.k5{--heat:var(--c5)}.k6{--heat:var(--c6)}
@keyframes grow{from{transform:scaleX(0)}}

.pill.won{background:var(--c1);color:#04170b}.pill.gave{background:var(--c5);color:#1d0b00}.pill.play{background:var(--panel2);color:var(--accent);border:1px solid var(--accent)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}

.summary b{display:block;font:400 1.6rem/1.1 var(--display);letter-spacing:.02em}.summary span{font-size:.75rem;color:var(--muted)}
.cal{margin:18px 0 6px}

.dow{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);padding-bottom:2px}
.d{aspect-ratio:1;min-width:0;display:flex;align-items:center;justify-content:center;border-radius:6px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);padding:0;cursor:pointer;position:relative}

.d.pad{border:0;background:none;cursor:default}
.d.off{opacity:.3;background:transparent;border-style:dashed;cursor:default}
.d.none:hover,.d.play:hover,.d.won:hover{filter:brightness(1.12);transform:translateY(-1px)}
.d.won{background:var(--c1);border-color:var(--c1);color:#04170b}

.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin:14px 2px 0}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

footer{color:var(--muted);font-size:.78rem;text-align:left;margin-top:26px}
@media (prefers-reduced-motion:reduce){.g.last .bar{animation:none}*{transition:none!important}}

header h1 button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:inherit;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit}
header h1 button:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
.menu-lead{color:var(--muted);margin:14px 2px 12px;font-size:.95rem}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding-bottom:28px}
.menu-card{--h:172;text-align:left;cursor:pointer;border:1.5px solid hsl(var(--h) 22% 28%);background:linear-gradient(160deg,hsl(var(--h) 40% 16%),var(--panel));color:var(--text);border-radius:10px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:118px;font:inherit;transition:transform .12s,border-color .12s}
.menu-card:hover,.menu-card:focus-visible{border-color:hsl(var(--h) 90% 60%);transform:translateY(-2px);outline:none}

@media (prefers-color-scheme:light){.menu-card{background:linear-gradient(160deg,hsl(var(--h) 55% 92%),#fff);border-color:hsl(var(--h) 25% 78%)}.menu-card b{color:hsl(var(--h) 80% 32%)}.menu-card:hover,.menu-card:focus-visible,.menu-card[aria-current=true]{border-color:hsl(var(--h) 80% 38%)}}

<body>
<div class="wrap">
  <header>
    <h1><button id="logo" type="button" title="Abrir o menu de jogos" aria-label="HIHIHIacerto — abrir o menu de jogos"><span class="mark" aria-hidden="true"></span>HIHIHIacerto</button></h1>
    <nav role="tablist">
      <button id="tabMenu" role="tab" aria-selected="false">Menu</button>
      <button id="tabPlay" role="tab" aria-selected="true">Jogar</button>
      <button id="tabHist" role="tab" aria-selected="false">Histórico</button>
    </nav>
  </header>
  <div class="modes" id="modes" role="group" aria-label="Modo de jogo"></div>

  <section id="menu" class="hidden" aria-label="Menu de jogos">
    <p class="menu-lead">Escolha um jogo. O desafio de hoje é o mesmo para todo mundo.</p>
    <div class="menu-grid" id="menuGrid"></div>
  </section>

  <section id="play">
    <div class="sub"><span id="chNum">Desafio —</span><span id="chDate"></span></div>
    <div class="card">
      <form id="f" autocomplete="off">
        <input id="in" type="text" inputmode="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Digite uma palavra" aria-label="Palavra">
        <button class="btn primary" id="send" type="submit">Enviar</button>
      </form>
      <div class="row">
        <button class="btn" id="hint" type="button">Dica</button>
        <button class="btn" id="giveup" type="button">Desistir</button>
      </div>
    </div>
    <div id="msg" role="status" aria-live="polite"></div>
    <div class="stats"><span>Tentativas <b id="sAtt">0</b></span><span>Melhor <b id="sBest">—</b></span><span>Dicas <b id="sHints">0</b></span><span>Tempo <b id="sTime" role="button" tabindex="0" title="Clique para esconder ou mostrar o tempo" style="cursor:pointer">0:00</b></span></div>
    <div id="end"></div>
    <div id="closest"></div>
    <div id="lastBox" class="hidden"><h2>Última tentativa</h2><div id="last"></div></div>
    <h2 id="listTitle" class="hidden">Por proximidade</h2>
    <div id="list"></div>
  </section>

  <section id="hist" class="hidden">
    <div class="summary" id="sum"></div>
    <div class="legend" aria-hidden="true"><span><i class="sw won"></i>Acertou</span><span><i class="sw play"></i>Jogou</span><span><i class="sw none"></i>Não jogou</span></div>
    <div id="hlist"></div>
    <button class="btn" id="more" style="width:100%;margin-top:12px">Mostrar mês anterior</button>
  </section>
  <footer id="foot"></footer>
</div>
<noscript>Este jogo precisa de JavaScript.</noscript>
<script src="data/modes.js"></script>
<script>
"use strict";
(()=>{
const $=id=>document.getElementById(id);
if(!window.MODES){document.body.innerHTML='<p style="padding:24px">Não foi possível carregar <code>data/modes.js</code>. Abra o jogo junto da pasta <code>data</code>.</p>';return;}
const MODES=window.MODES.modes, START_STR=window.MODES.start;
const GAMES=window.GAMES=window.GAMES||{};
let mode="normal", G=null, N=0, MAN=null, K=null;

const key=s=>s.normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().replace(/[\s\-.'’:]+/g,"");
const fmt=n=>n.toLocaleString("pt-BR");
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const modeName=id=>(MODES.find(m=>m.id===id)||{}).name||id;
const metaUrl=id=>id==="normal"?"data/meta.js":"data/"+id+"/meta.js";
const rankUrl=(id,idx)=>(id==="normal"?"data/r/":"data/"+id+"/r/")+idx+".js";

/* ---------- datas e desafios (determinísticos) ---------- */
const [SY,SM,SD]=START_STR.split("-").map(Number);
const DAY=86400000, START_UTC=Date.UTC(SY,SM-1,SD);
const todayN=()=>{const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-START_UTC)/DAY)+1;};
const answerIdx=n=>G.order[(n-1)%G.order.length];
const dateOf=n=>new Date(START_UTC+(n-1)*DAY).toLocaleDateString("pt-BR",{timeZone:"UTC",day:"2-digit",month:"2-digit",year:"numeric"});

/* ---------- dados do modo ---------- */
const loadMode=id=>new Promise((res,rej)=>{
  if(GAMES[id])return res(GAMES[id]);
  const s=document.createElement("script");s.src=metaUrl(id);
  s.onload=()=>{if(id==="normal"&&window.GAME)GAMES.normal=window.GAME;GAMES[id]?res(GAMES[id]):rej(new Error("Dados do modo inválidos."));};
  s.onerror=()=>rej(new Error("Modo indisponível: abra-o uma vez com internet para baixar os dados."));
  document.head.appendChild(s);
});
async function useMode(id){
  const g=await loadMode(id);
  mode=id;G=g;N=g.vocab.length;MAN=g.manifest;document.documentElement.dataset.mode=id;
  K=new Map();g.vocab.forEach((w,i)=>K.set(key(w),i));
}

/* ---------- armazenamento local (IndexedDB, com fallback) ---------- */
const store=(()=>{
  let db=null;
  const open=()=>new Promise(res=>{
    try{
      const rq=indexedDB.open("hihihiacerto",1);          // banco novo: a sequência de palavras foi recomeçada do zero
      rq.onupgradeneeded=()=>{rq.result.createObjectStore("games2",{keyPath:"id"})};
      rq.onsuccess=()=>{db=rq.result;res(true)};
      rq.onerror=()=>res(false);
    }catch(e){res(false)}
  });
  const ls={
    get:id=>{try{return JSON.parse(localStorage.getItem("hia2:"+id))}catch(e){return null}},
    put:r=>{try{localStorage.setItem("hia2:"+r.id,JSON.stringify(r))}catch(e){}},
    all:()=>{const o=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("hia2:"))o.push(JSON.parse(localStorage.getItem(k)))}}catch(e){}return o}
  };
  const tx=(mode,fn)=>new Promise((res,rej)=>{const t=db.transaction("games2",mode);const r=fn(t.objectStore("games2"));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});
  return {
    async init(){this.ok=await open();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}},
    async get(id){return this.ok?await tx("readonly",s=>s.get(id)):ls.get(id)},
    async put(r){this.ok?await tx("readwrite",s=>s.put(r)):ls.put(r)},
    async all(){return this.ok?await tx("readonly",s=>s.getAll()):ls.all()}
  };
})();

/* ---------- ranking pré-calculado (arquivo por resposta) ---------- */
const RK={};
window.__R=(idx,b64)=>{
  const src=(document.currentScript&&document.currentScript.src)||"";
  const m=src.match(/data\/([^\/]+)\/r\//);
  const id=m?m[1]:"normal";
  const n=GAMES[id].vocab.length;
  const bin=atob(b64);
  if(bin.length!==2*n)throw new Error("ranking com tamanho inesperado");
  const u=new Uint16Array(n);
  for(let i=0;i<n;i++)u[i]=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);
  RK[id+":"+idx]=u;
};
const loadRank=(id,idx)=>new Promise((res,rej)=>{
  const k=id+":"+idx;
  if(RK[k])return res(RK[k]);
  const s=document.createElement("script");s.src=rankUrl(id,idx);
  s.onload=()=>RK[k]?res(RK[k]):rej(new Error("formato inválido"));
  s.onerror=()=>rej(new Error("Ranking indisponível: abra este desafio uma vez com internet para baixá-lo."));
  document.head.appendChild(s);
});

/* ---------- estado ---------- */
let cur=null, closestOpen=false;
let tick=null, lastTick=0, lastSave=0;
const newRec=(n,idx)=>({id:mode+":"+n,mode,n,date:dateOf(n),idx,word:G.vocab[idx],v:MAN.vocab_version,guesses:[],hints:0,best:null,solved:false,gaveUp:false,elapsed:0,started:Date.now(),finished:null});
const finished=()=>cur&&(cur.rec.solved||cur.rec.gaveUp);

async function openChallenge(n){
  const max=todayN();
  if(max<1){setMsg("O primeiro desafio começa em "+dateOf(1)+".","");return;}
  if(n<1||n>max){setMsg("Esse desafio ainda não está disponível.","err");return;}
  stopTick();closestOpen=false;
  const idx=answerIdx(n);
  let rec=await store.get(mode+":"+n);
  if(rec&&rec.idx!==idx)rec=null;   // segurança: nunca misturar respostas
  try{
    const r=await loadRank(mode,idx);
    const pos=new Int32Array(N+2);for(let i=0;i<N;i++)pos[r[i]]=i;
    cur={n,idx,r,pos,rec:rec||newRec(n,idx)};
  }catch(e){setMsg(e.message,"err");return;}
  history.replaceState(null,"","#"+mode+"/"+n);
  setMsg("","");
  render(true);
  if(!finished())startTick();
  setTab("play");
  $("in").focus({preventScroll:true});
}
async function switchMode(id,n){
  if(cur&&!finished())stopTick();
  try{await useMode(id);}catch(e){setMsg(e.message,"err");return;}
  cur=null;renderModes();
  await openChallenge(n||Math.max(1,todayN()));
}

function startTick(){lastTick=Date.now();tick=setInterval(()=>{
  if(document.hidden||finished()){lastTick=Date.now();return;}
  const now=Date.now();cur.rec.elapsed+=now-lastTick;lastTick=now;
  showT(cur.rec.elapsed);
  if(now-lastSave>5000){lastSave=now;store.put(cur.rec)}
},1000)}
function stopTick(){if(tick){clearInterval(tick);tick=null;if(cur&&!finished()){cur.rec.elapsed+=Date.now()-lastTick;store.put(cur.rec)}}}
let hideTime=false;try{hideTime=localStorage.getItem("hideTime")==="1"}catch(e){}
const clock=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
let lastEl=0;function showT(ms){lastEl=ms;const e=$("sTime");e.textContent=hideTime?"•:••":clock(ms);e.classList.toggle("hid",hideTime)}
function toggleT(){hideTime=!hideTime;try{localStorage.setItem("hideTime",hideTime?"1":"0")}catch(e){}showT(lastEl)}
$("sTime").addEventListener("click",toggleT);$("sTime").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleT()}});

/* ---------- tentativas ---------- */
function lookup(raw){
  const t=raw.trim();
  if(!t)return {err:"Digite uma palavra."};
  const k=key(t);
  if(!/^[\p{L}\p{N}]+$/u.test(k))return {err:"Essa palavra não está no vocabulário."};
  if(K.has(k))return {idx:K.get(k)};
  if(Object.prototype.hasOwnProperty.call(G.forms,k))return {idx:G.forms[k]};
  return {err:"Essa palavra não está no vocabulário.",unknown:k};
}
/* “você quis dizer”: distância de edição (com troca de letras vizinhas) sobre a grafia e sobre uma forma fonética simples */
const phon=s=>s.replace(/ch|sh/g,"x").replace(/ph/g,"f").replace(/ck/g,"k").replace(/ç/g,"s").replace(/c(?![eiy])/g,"k").replace(/c/g,"s").replace(/[yw]/g,m=>m==="y"?"i":"u").replace(/h/g,"").replace(/(.)\1+/g,"$1");
function dist(a,b,max){
  const n=a.length,m=b.length;if(Math.abs(n-m)>max)return max+1;
  let p2=null,p1=Array.from({length:m+1},(_,j)=>j);
  for(let i=1;i<=n;i++){
    const c=[i];let lo=i;
    for(let j=1;j<=m;j++){
      let v=Math.min(p1[j]+1,c[j-1]+1,p1[j-1]+(a[i-1]===b[j-1]?0:1));
      if(p2&&i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])v=Math.min(v,p2[j-2]+1);
      c.push(v);if(v<lo)lo=v;
    }
    if(lo>max)return max+1;
    p2=p1;p1=c;
  }
  return p1[m];
}
let SUGG=null;
function suggestions(k){
  if(!SUGG||SUGG.g!==G)SUGG={g:G,k:G.vocab.map(w=>key(w)),p:G.vocab.map(w=>phon(key(w)))};
  const n=k.length;if(n<3)return [];
  const max=n<=4?1:n<=8?2:3,pk=phon(k),have=new Set(cur?cur.rec.guesses.map(x=>x.idx):[]),out=[];
  for(let i=0;i<SUGG.k.length;i++){
    if(have.has(i))continue;
    if(n>=4&&G.vocab[i].includes(" ")&&(SUGG.k[i].startsWith(k)||SUGG.k[i].endsWith(k))&&SUGG.k[i]!==k){out.push([0.4,G.vocab[i]]);continue}
    const d=Math.min(dist(k,SUGG.k[i],max),dist(pk,SUGG.p[i],max)+0.5);
    if(d<=max)out.push([d,G.vocab[i]]);
  }
  out.sort((x,y)=>x[0]-y[0]||x[1].localeCompare(y[1]));
  return out.slice(0,3).map(x=>x[1]);
}
function setSuggest(k){
  const m=$("msg"),list=suggestions(k);m.className="err";m.textContent="Essa palavra não está no vocabulário.";
  if(!list.length)return;
  m.append(" Você quis dizer: ");
  list.forEach((w,i)=>{
    if(i)m.append(i===list.length-1?" ou ":", ");
    const b=document.createElement("button");b.type="button";b.className="sug";b.dataset.w=w;b.textContent=w;m.append(b);
  });
  m.append("?");
}
function recompute(){
  const g=cur.rec.guesses.filter(x=>!x.reveal);
  cur.rec.best=g.length?Math.min(...g.map(x=>x.rank)):null;
}
async function submit(raw){
  if(!cur||finished())return;
  const L=lookup(raw);
  if(L.err){if(L.unknown)setSuggest(L.unknown);else setMsg(L.err,"err");return;}          // inválida: não registra, não altera progresso, não gasta dica
  const idx=L.idx;
  const dup=cur.rec.guesses.find(x=>x.idx===idx);
  if(dup){setMsg("Você já tentou “"+G.vocab[idx]+"” (posição "+fmt(dup.rank)+").","err");flash(idx);return;}
  const rank=cur.r[idx];
  cur.rec.guesses.push({idx,word:G.vocab[idx],rank,t:Date.now()});
  recompute();
  if(rank===1){cur.rec.solved=true;cur.rec.finished=Date.now();stopTick();setMsg("Você acertou!","ok");}
  else setMsg("","");
  await store.put(cur.rec);
  render();
  $("in").value="";
}
function pickHint(){
  const gs=cur.rec.guesses, guessed=new Set(gs.map(x=>x.idx));
  const Lr=gs.length?Math.min(...gs.filter(x=>!x.reveal).map(x=>x.rank)):Math.min(N+1,1500);  // referência: sua MELHOR posição
  const free=p=>p>=2&&p<=N&&!guessed.has(cur.pos[p]);                                          // a #1 nunca é dica
  const hi=Lr-1;
  if(hi>=2){                                                                                   // há espaço entre a #2 e a sua melhor
    let t=Math.round(Lr*(0.3+Math.random()*0.4));t=Math.max(2,Math.min(hi,t));
    for(let d=0;d<=N;d++){
      for(const p of [t-d,t+d]){if(p>=2&&p<=hi&&free(p))return {idx:cur.pos[p]};}
      if(t-d<2&&t+d>hi)break;
    }
  }
  for(let p=2;p<=N;p++)if(free(p))return {idx:cur.pos[p]};                                    // senão: a próxima mais perto ainda não usada (#3, #4…)
  return null;
}
async function hint(){
  if(!cur||finished())return;
  const h=pickHint();
  if(!h){setMsg("Sem dicas disponíveis.","err");return;}
  cur.rec.hints++;
  const rank=cur.r[h.idx];
  cur.rec.guesses.push({idx:h.idx,word:G.vocab[h.idx],rank,t:Date.now(),hint:true});
  setMsg("Dica: “"+G.vocab[h.idx]+"” está na posição "+fmt(rank)+".","ok");
  recompute();
  await store.put(cur.rec);
  render();
}
async function giveUp(){
  if(!cur||finished())return;
  if(!confirm("Desistir e revelar a resposta?"))return;
  cur.rec.guesses.push({idx:cur.idx,word:G.vocab[cur.idx],rank:1,t:Date.now(),reveal:true});
  cur.rec.gaveUp=true;cur.rec.finished=Date.now();stopTick();recompute();
  await store.put(cur.rec);render();
}

/* ---------- interface ---------- */
function setMsg(t,c){const m=$("msg");m.textContent=t;m.className=c||""}
const kls=r=>r===1?"k1":r<=50?"k2":r<=300?"k3":r<=1500?"k4":r<=5000?"k5":"k6";
const pct=r=>Math.max(3,Math.min(100,100*(1-Math.log10(r)/Math.log10(N+1))));
function item(g,extra){
  const tags=(g.mine?'<span class="tag">sua tentativa</span>':"")+(g.hint?'<span class="tag">dica</span>':"")+(g.reveal&&!g.hint?'<span class="tag">revelada</span>':"");
  return '<div class="g '+kls(g.rank)+(extra||"")+'" data-i="'+g.idx+'"><div class="bar" style="width:'+pct(g.rank)+'%"></div><span class="w">'+esc(g.word)+tags+'</span><span class="r">'+(g.rank===1?"★ 1":fmt(g.rank))+'</span></div>';
}
function flash(idx){const e=document.querySelector('#list [data-i="'+idx+'"]');if(e){e.scrollIntoView({block:"nearest"});e.animate([{transform:"scale(1.03)"},{transform:"scale(1)"}],{duration:300})}}
function renderModes(){
  $("modes").innerHTML=MODES.map(m=>'<button data-m="'+m.id+'" aria-pressed="'+(m.id===mode)+'" title="'+esc(m.desc)+'">'+esc(m.name)+'</button>').join("");
}
function render(first){
  const r=cur.rec, gs=r.guesses, fin=finished();
  $("chNum").textContent=modeName(mode)+" · Desafio #"+r.n;$("chDate").textContent=dateOf(r.n);
  $("sAtt").textContent=gs.filter(x=>!x.hint&&!x.reveal).length;
  $("sBest").textContent=r.best==null?"—":fmt(r.best);
  $("sHints").textContent=r.hints;showT(r.elapsed);
  $("in").disabled=$("send").disabled=$("hint").disabled=$("giveup").disabled=fin;
  const sorted=[...gs].sort((a,b)=>a.rank-b.rank||a.t-b.t);
  const last=gs.length?gs[gs.length-1]:null;
  $("lastBox").classList.toggle("hidden",!last||fin);
  $("last").innerHTML=last&&!fin?item(last," last"):"";
  $("listTitle").classList.toggle("hidden",!gs.length);
  $("list").innerHTML=sorted.map((g,i)=>item(g,(i===0&&g.rank>1?" top":""))).join("");
  const att=gs.filter(x=>!x.hint&&!x.reveal).length;
  if(r.solved){
    $("end").innerHTML='<div class="banner"><strong>🎉 Você descobriu: '+esc(r.word)+'</strong>'+att+' tentativa'+(att===1?"":"s")+' · '+r.hints+' dica'+(r.hints===1?"":"s")+' · '+clock(r.elapsed)+'<div class="row" style="justify-content:center"><button class="btn" id="share" style="flex:0 0 auto">Copiar resultado</button><button class="btn closeBtn" style="flex:0 0 auto"></button></div></div>';
    $("share").onclick=share;
  }else if(r.gaveUp){
    $("end").innerHTML='<div class="banner lost"><strong>A palavra era: '+esc(r.word)+'</strong>Você desistiu ou a resposta foi revelada por dica.<div class="row" style="justify-content:center"><button class="btn closeBtn" style="flex:0 0 auto"></button></div></div>';
  }else $("end").innerHTML="";
  document.querySelectorAll(".closeBtn").forEach(b=>{b.textContent=closestOpen?"Ocultar as mais próximas":"Ver as 200 mais próximas";b.onclick=()=>{closestOpen=!closestOpen;render()}});
  renderClosest();
  $("foot").textContent="Modo "+modeName(mode)+" · vocabulário "+MAN.vocab_version+" · "+fmt(N)+" palavras · "+MAN.embedding_model+" "+MAN.model_version+" · similaridade "+MAN.similarity+(MAN.derived_vectors?" · "+fmt(MAN.derived_vectors)+" nomes com vetor derivado":"");
}
function renderClosest(){
  const box=$("closest");
  if(!cur||!finished()||!closestOpen){box.innerHTML="";return;}
  const mine=new Set(cur.rec.guesses.map(g=>g.idx));
  let h='<h2>As 200 palavras mais próximas</h2>';
  for(let p=1;p<=200&&p<=N;p++){const i=cur.pos[p];h+=item({idx:i,word:G.vocab[i],rank:p,mine:mine.has(i)},mine.has(i)?" mine":"");}
  box.innerHTML=h;
}
function share(){
  const r=cur.rec,c={k1:0,k2:0,k3:0,k4:0,k5:0,k6:0};
  r.guesses.forEach(g=>{if(!g.reveal)c[kls(g.rank)]++});
  const att=r.guesses.filter(x=>!x.hint&&!x.reveal).length;
  const t="HIHIHIacerto · "+modeName(mode)+" #"+r.n+"\n✅ "+att+" tentativas · "+r.hints+" dicas\n🟩"+(c.k1+c.k2)+" 🟨"+(c.k3+c.k4)+" 🟧"+c.k5+" 🟥"+c.k6;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>setMsg("Resultado copiado.","ok"),()=>prompt("Copie:",t));
}

/* ---------- histórico (do modo atual) ---------- */
let histShown=0;
const sr=t=>'<span class="sr">'+t+'</span>';
async function renderHist(reset){
  const all=(await store.all()).filter(r=>(r.mode||"normal")===mode), map=new Map(all.map(r=>[r.n,r]));
  const t=todayN();
  if(reset)histShown=0;
  const won=all.filter(r=>r.solved).length, gave=all.filter(r=>r.gaveUp).length;
  let streak=0;for(let n=t;n>=1;n--){const r=map.get(n);if(r&&r.solved)streak++;else if(n===t&&!(r&&(r.solved||r.gaveUp)))continue;else break;}
  $("sum").innerHTML=[["Jogados",all.filter(r=>r.guesses&&r.guesses.length).length],["Vitórias",won],["Desistências",gave],["Sequência",streak]].map(([l,v])=>"<div><b>"+v+"</b><span>"+l+"</span></div>").join("");
  /* calendário: um bloco por mês, do mais recente (hoje) para trás até o mês do desafio nº 1 */
  const td=new Date(START_UTC+(t-1)*DAY), sd=new Date(START_UTC);
  const monthsTotal=(td.getUTCFullYear()-sd.getUTCFullYear())*12+td.getUTCMonth()-sd.getUTCMonth()+1;
  histShown=Math.min(Math.max(histShown+1,1),monthsTotal);
  let html="";
  for(let k=0;k<histShown;k++){
    const y=td.getUTCFullYear(), m=td.getUTCMonth()-k, first=new Date(Date.UTC(y,m,1)), dim=new Date(Date.UTC(y,m+1,0)).getUTCDate();
    let cells="";
    for(let i=0;i<first.getUTCDay();i++)cells+='<span class="d pad"></span>';
    for(let d=1;d<=dim;d++){
      const n=Math.floor((Date.UTC(first.getUTCFullYear(),first.getUTCMonth(),d)-START_UTC)/DAY)+1;
      if(n<1||n>t){cells+='<span class="d off"><b>'+d+'</b></span>';continue;}
      const r=map.get(n);let cls="none",det="",lab="não jogado";
      if(r&&r.solved){cls="won";lab="acertou";det=r.guesses.filter(x=>!x.hint&&!x.reveal).length+" tent. · "+r.hints+" dicas · "+clock(r.elapsed)+" · "+esc(r.word);}
      else if(r&&r.gaveUp){cls="play";lab="desistiu";det="melhor "+(r.best==null?"—":fmt(r.best))+" · "+esc(r.word);}
      else if(r&&r.guesses.length){cls="play";lab="em andamento";det=r.guesses.length+" tent. · melhor "+(r.best==null?"—":fmt(r.best));}
      const txt="#"+n+" · "+dateOf(n)+(n===t?" (hoje)":"")+" "+(det?det+" ":"")+lab;
      cells+='<button class="hist-item d '+cls+(n===t?" today":"")+'" data-n="'+n+'" title="'+txt+'" aria-label="'+txt+'"><b>'+d+'</b>'+sr(txt)+'</button>';
    }
    let title=first.toLocaleDateString("pt-BR",{timeZone:"UTC",month:"long",year:"numeric"});title=title.charAt(0).toUpperCase()+title.slice(1);
    html+='<section class="cal"><h3>'+title+'</h3><div class="calgrid">'+["D","S","T","Q","Q","S","S"].map(x=>'<span class="dow" aria-hidden="true">'+x+'</span>').join("")+cells+'</div></section>';
  }
  $("hlist").innerHTML=html;
  $("more").classList.toggle("hidden",histShown>=monthsTotal);
}
function setTab(t){
  const play=t==="play",menu=t==="menu";
  $("play").classList.toggle("hidden",!play);$("hist").classList.toggle("hidden",t!=="hist");$("menu").classList.toggle("hidden",!menu);
  $("modes").classList.toggle("hidden",menu);
  $("tabPlay").setAttribute("aria-selected",play);$("tabHist").setAttribute("aria-selected",t==="hist");$("tabMenu").setAttribute("aria-selected",menu);
  if(t==="hist")renderHist(true);
  if(menu)renderMenu();
}


/* ---------- menu de jogos ---------- */
const HUE={normal:172,anime:330,naruto:26,fa:128,onepiece:214,pokemon:52,minecraft:104,pokemon1:6,nfl:236,lol:275};
async function renderMenu(){
  const n=Math.max(1,todayN()),grid=$("menuGrid");let html="";
  for(const m of MODES){
    let st="Hoje: não jogado";
    try{const r=await store.get(m.id+":"+n);
      if(r&&(r.solved||r.gaveUp||r.guesses.length)){const att=r.guesses.filter(x=>!x.hint&&!x.reveal).length;
        st=r.solved?"Hoje: acertou em "+att+(att===1?" tentativa":" tentativas"):r.gaveUp?"Hoje: desistiu":"Hoje: em andamento · "+att+(att===1?" tentativa":" tentativas")}
    }catch(e){}
    html+='<button class="menu-card" data-m="'+m.id+'" style="--h:'+(HUE[m.id]||172)+'"'+(m.id===mode?' aria-current="true"':'')+'><b>'+esc(m.name)+'</b><span>'+esc(m.desc||"")+'</span><em>'+st+'</em></button>';
  }
  grid.innerHTML=html;
}
async function openMenu(){if(cur&&!finished())stopTick();if(cur){try{await store.put(cur.rec)}catch(e){}}setTab("menu")}
$("logo").onclick=openMenu;$("tabMenu").onclick=openMenu;
$("menuGrid").addEventListener("click",e=>{const b=e.target.closest("button[data-m]");if(!b)return;
  if(b.dataset.m===mode){if(cur&&!finished())startTick();setTab("play");$("in").focus({preventScroll:true})}else switchMode(b.dataset.m)});

/* ---------- eventos ---------- */
$("f").addEventListener("submit",e=>{e.preventDefault();submit($("in").value)});
$("hint").onclick=hint;$("giveup").onclick=giveUp;
$("tabPlay").onclick=()=>{setTab("play");if(cur&&!finished()&&!tick)startTick()};$("tabHist").onclick=()=>setTab("hist");
$("more").onclick=()=>renderHist(false);
$("hlist").addEventListener("click",e=>{const b=e.target.closest(".hist-item");if(b)openChallenge(+b.dataset.n)});
$("msg").addEventListener("click",e=>{const b=e.target.closest("button.sug");if(b)submit(b.dataset.w)});
$("modes").addEventListener("click",e=>{const b=e.target.closest("button[data-m]");if(b&&b.dataset.m!==mode)switchMode(b.dataset.m)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&cur&&!finished())store.put(cur.rec)});
addEventListener("pagehide",()=>{if(cur&&!finished()){cur.rec.elapsed+=Date.now()-lastTick;store.put(cur.rec)}});

/* ---------- offline (service worker; só em http/https) ---------- */
async function precache(){
  if(!("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)))return;
  try{
    await Promise.all(MODES.map(m=>loadMode(m.id).catch(()=>null)));
    const reg=await navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready);
    const urls=MODES.map(m=>metaUrl(m.id)),t=todayN();
    for(const m of MODES){const g=GAMES[m.id];if(!g)continue;for(let d=0;d<=4;d++){const n=t+d;if(n>=1)urls.push(rankUrl(m.id,g.order[(n-1)%g.order.length]))}}
    reg.active&&reg.active.postMessage({type:"precache",urls});
  }catch(e){}
}

/* ---------- início ---------- */
(async()=>{
  await store.init();
  const t=todayN();
  const m=location.hash.slice(1).match(/^(?:([a-z0-9]+)\/)?(\d+)$/);
  let id="normal",n=Math.max(1,t);
  if(m){if(m[1]&&MODES.some(x=>x.id===m[1]))id=m[1];const h=+m[2];if(h>=1&&h<=t)n=h;}
  renderModes();
  await switchMode(id,n);
  precache();
})();
})();
